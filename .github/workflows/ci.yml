name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  #      - run: uv run mypy todo where is mypy? - tests droped

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.22" }
      - run: uv sync --locked
      - run: uv run pytest tests/unit -p no:cacheprovider -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose -p user-tests -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from tests
          docker compose -p user-tests -f docker-compose.test.yml down

  build-and-stage:
    needs: [lint, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/sun1tar/smai-user:sha-${{ steps.sha.outputs.short }}

      - name: Build payload
        id: payload
        env:
          ENV_BLOCK: ${{ secrets.USER_ENV }}
          IMAGE: ghcr.io/sun1tar/smai-user:sha-${{ steps.sha.outputs.short }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "service": "user",
            "environment": "stage",
            "image": "$IMAGE",
            "env": {
          $ENV_BLOCK
            }
          }
          EOF
          )
          echo "payload<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: Sun1tAr/smai-infra
          event-type: stage-service
          client-payload: ${{ steps.payload.outputs.payload }}

  build-and-prod:
    needs: [lint, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/sun1tar/smai-user:sha-${{ steps.sha.outputs.short }}

      - name: Build payload
        id: payload
        env:
          ENV_BLOCK: ${{ secrets.USER_ENV }}
          IMAGE: ghcr.io/sun1tar/smai-user:sha-${{ steps.sha.outputs.short }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "service": "user",
            "environment": "prod",
            "image": "$IMAGE",
            "env": {
          $ENV_BLOCK
            }
          }
          EOF
          )
          echo "payload<<EOF" >> $GITHUB_OUTPUT
          echo "$PAYLOAD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_PAT }}
          repository: Sun1tAr/smai-infra
          event-type: stage-service
          client-payload: ${{ steps.payload.outputs.payload }}