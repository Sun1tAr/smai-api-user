[project]
name = "smai-api-user"
version = "0.1.0"
description = "SmartMeal user service (MS-3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anyio>=4,<5",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "prometheus-fastapi-instrumentator>=8.1,<9",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=25,<27",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a dedicated PostgreSQL database (TEST_DB_HOST)"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
